<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registrer kunde</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="popup-overlay">
    <div class="popup-container">

        <h1>Registrer ny kunde</h1>

        <p th:if="${error}" th:text="${error}" style="color: red; text-align: center; margin-bottom: 15px;"></p>

        <form action="/register_customer" method="post">

            <div class="form-group">
                <label for="customerName">Navn</label>
                <input type="text" id="customerName" name="customerName">
            </div>

            <div class="form-group">
                <label for="address">Adresse</label>
                <input type="text" id="address" name="address">
            </div>

            <div class="form-group">
                <label for="city">By</label>
                <input type="text" id="city" name="city">
            </div>

            <div class="form-group">
                <label for="zipCode">Postnummer</label>
                <input type="text" id="zipCode" name="zipCode">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="phone">Telefon</label>
                <input type="tel" id="phone" name="phone">
            </div>

            <div class="button-group">
                <button type="submit" class="save-btn">Opret kunde</button>
                <a th:href="@{/}" class="cancel-btn">Annuller</a>
            </div>

        </form>
    </div>
</div>

</body>
</html>

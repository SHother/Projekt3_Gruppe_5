<div th:fragment="customerPopup">

    <div th:if="${showCustomerPopup}" class="popup-overlay">
        <div class="popup-container">

            <h1>Registrer ny kunde</h1>

            <form action="/register_customer" method="post">

                <div class="form-group">
                    <label for="customerName">Navn</label>
                    <input type="text" id="customerName" name="customerName">
                </div>

                <div class="form-group">
                    <label for="address">Adresse</label>
                    <input type="text" id="address" name="address">
                </div>

                <div class="form-group">
                    <label for="city">By</label>
                    <input type="text" id="city" name="city">
                </div>

                <div class="button-group">
                    <button type="submit" class="save-btn">Opret kunde</button>
                    <a th:href="@{/}" class="cancel-btn">Annuller</a>
                </div>

            </form>
        </div>
    </div>
</div>

<!-- Ansvarlig: Gustav -->

<div th:fragment="customerPopup">   <!-- Thymeleaf fragment som indeholder popup til registrering af kunder -->

    <div th:if="${showCustomerPopup}" class="popup-overlay">    <!-- Popup vises kun hvis showCustomerPopup=true sendes fra controlleren -->
        <div class="popup-container">

            <h1>Registrer ny kunde</h1>

            <form action="/register_customer" method="post">    <!-- Sender kundeoplysninger til backend for oprettelse af ny kunde -->

                <div class="form-group">
                    <label for="customerName">Navn</label>
                    <input type="text" id="customerName" name="customerName">
                </div>

                <div class="form-group">
                    <label for="address">Adresse</label>
                    <input type="text" id="address" name="address">
                </div>

                <div class="form-group">
                    <label for="city">By</label>
                    <input type="text" id="city" name="city">
                </div>

                <div class="form-group">
                    <label for="zipCode">Zip kode</label>
                    <input type="text" id="zipCode" name="zipCode">
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="text" id="email" name="email">
                </div>

                <div class="form-group">
                    <label for="phone">Telefon nummer</label>
                    <input type="text" id="phone" name="phone">
                </div>

                <div class="button-group">
                    <button type="submit" class="save-btn">Opret kunde</button>
                    <a th:href="@{/}" class="cancel-btn">Annuller</a>   <!-- Lukker popup-vinduet ved at navigere tilbage til dashboardet -->
                </div>

            </form>
        </div>
    </div>
</div>
